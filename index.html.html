<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Love ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .home {
            width: 90%;
            max-width: 900px;
            text-align: center;
            color: rgb(184, 98, 98);
            padding: 40px;
        }

        .heart {
            font-size: 80px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        h1 {
            font-size: 55px;
            margin: 20px 0 10px;
        }

        h2 {
            font-size: 25px;
            font-weight: normal;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 15px 35px;
            background: rgb(160, 28, 28);
            color: #e75480;
            text-decoration: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            background: #e796ae;
            transform: scale(1.08);
        }

        .small-heart {
            position: absolute;
            font-size: 25px;
            animation: float 5s infinite ease-in-out;
            opacity: 0.8;
        }

        .heart1 {
            top: 15%;
            left: 10%;
        }

        .heart2 {
            top: 70%;
            left: 20%;
        }

        .heart3 {
            top: 20%;
            right: 15%;
        }

        .heart4 {
            top: 75%;
            right: 20%;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }

            100% {
                transform: translateY(0);
            }
        }

        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgb(202, 117, 117);
            font-size: 14px;
        }
    </style>
</head>

<body>
    <!-- Floating Hearts -->
    <div class="small-heart heart1">❤️</div>
    <div class="small-heart heart2">💕</div>
    <div class="small-heart heart3">💗</div>
    <div class="small-heart heart4">💖</div>

    <!-- HOME PAGE -->
    <div class="home">

        <div class="heart">❤️</div>

        <h1>For My Morning Star❤️</h1>

        <h2>From your ugliest Boy❤️</h2>

        <p>
            I made this little website just for you.
            There are so many things I want to tell you,
            and sometimes words aren't enough.
        </p>

        <a href="letter.html.html" class="button">
            Open My Message 💌
        </a>

    </div>

    <footer>
        I LOVE YOU ❤️
    </footer>

</body>
</html>
